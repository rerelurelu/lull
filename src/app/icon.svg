<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景: サイトのブランド配色 セージ → シアン (OGPと同一トーン) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4D8AF"/>
      <stop offset="100%" stop-color="#3F92C5"/>
    </linearGradient>
  </defs>

  <!-- 角丸スクエアの背景 -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGradient)"/>

  <!-- そよ風 -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <!-- 上: 短い流れ (右寄り) -->
    <path d="M 196 178 C 246 156 300 158 348 180"
          stroke-width="28" opacity="0.7"/>
    <!-- 中央: 主流。末端が大きくひらいて巻き上がる -->
    <path d="M 90 296 C 160 262 235 262 300 288
             C 345 306 386 302 408 278
             C 428 256 424 222 398 210
             C 379 201 356 210 350 230"
          stroke-width="34"/>
    <!-- 下: 短い余韻 (左寄り) -->
    <path d="M 130 388 C 185 366 240 368 292 388"
          stroke-width="26" opacity="0.55"/>
  </g>
</svg>
